<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星际障碍 · 战斗手感原型</title><style>
*{box-sizing:border-box}body{margin:0;background:#030b12;color:#cbe3e8;font:14px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100vh}header{position:fixed;top:25px;left:30px;pointer-events:none}small{color:#6f9aa8;letter-spacing:.18em}h1{font-size:24px;font-weight:450;margin:9px 0}header p{font-size:12px;color:#88a8b4}#stats{position:fixed;right:30px;top:30px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.9}#score{font-size:32px;color:#d5ffff}footer{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:12px 18px;background:#10202bed;border:1px solid #35505e;border-radius:14px;display:flex;gap:12px;align-items:center;white-space:nowrap}button,select{background:#183543;color:#daf3f6;border:1px solid #456674;border-radius:7px;padding:8px;cursor:pointer}button.primary{background:#b1e7e7;color:#09202a}label{font-size:12px}dialog{color:#dbf1f4;background:#0d1e2a;border:1px solid #416472;border-radius:18px;padding:30px;max-width:470px;width:90vw}dialog::backdrop{background:#010711b8}dialog p{line-height:1.8;color:#9bb9c3}dialog button{margin-right:8px}#modeName{min-width:145px;text-align:center}#note{position:fixed;left:30px;bottom:95px;color:#6e94a4;font-size:11px;pointer-events:none}
</style><canvas id="field"></canvas><header><small>COMBAT STUDY / 可丢弃原型</small><h1>星际障碍</h1><p>WASD / 方向键移动 · 自动射击 · P 暂停 · Esc 结束</p><p id="description"></p></header><div id="stats"><div id="score">00000</div><div id="state">等待开始</div><div id="metrics"></div></div><div id="note">验证：移动与射击是否顺手，四周来袭是否公平？<br>飞船中心小亮点为碰撞范围；光球无碰撞。未连接正式首页与开场。</div><footer><button id="prev">←</button><span id="modeName"></span><button id="next">→</button><button id="start" class="primary">开始 / 重开</button><button id="pause">暂停</button><label>移速 <input id="speed" type="range" min="180" max="500" value="300" step="20"></label><label><input id="hitbox" type="checkbox">显示碰撞圈</label></footer><dialog id="result"><h2 id="resultTitle"></h2><p id="resultBody"></p><button id="resume" class="primary">继续</button><button id="again">再玩一次</button><button id="close">返回待机</button></dialog><script>
// THROWAWAY visual/feel study: three structurally different weapon patterns.
const $=id=>document.getElementById(id),c=$('field'),g=c.getContext('2d');
const modes={A:['前向突破','正前方双发；四颗卫星只作视觉陪伴。'],B:['扇面清障','三向扇形射击；扩大前方覆盖面，侧后方仍需闪避。'],C:['双发卫星护航','已选方案：飞船向前双发，四颗旋转卫星各沿径向开火。']};
let mode=new URL(location.href).searchParams.get('variant')||'C';if(!modes[mode])mode='C';
let w=innerWidth,h=innerHeight,state='idle',elapsed=0,score=0,kills=0,bullets=[],rocks=[],sparks=[],spawn=0,fire=0,orbit=0,last=0;
let ship={x:w/2,y:h-155},keys=new Set();
const stars=Array.from({length:160},()=>[Math.random(),Math.random(),Math.random()]);
function size(){w=innerWidth;h=innerHeight;let d=Math.min(devicePixelRatio,2);c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0);ship.x=Math.min(w-35,ship.x);ship.y=Math.min(h-105,ship.y);if(state==='playing')pause('窗口尺寸变化，确认后继续。');}size();addEventListener('resize',size);
function modeUI(){ $('modeName').textContent=mode+' · '+modes[mode][0];$('description').textContent=modes[mode][1];let u=new URL(location.href);u.searchParams.set('variant',mode);history.replaceState(null,'',u);}
function change(d){mode=Object.keys(modes)[(Object.keys(modes).indexOf(mode)+d+3)%3];idle();modeUI();}
$('prev').onclick=()=>change(-1);$('next').onclick=()=>change(1);
function idle(){state='idle';keys.clear();bullets=[];rocks=[];sparks=[];elapsed=score=kills=orbit=0;ship={x:w/2,y:h-155};$('result').close();}
function start(){idle();state='playing';spawn=.8;fire=0;document.activeElement.blur();}
$('start').onclick=start;$('again').onclick=start;$('close').onclick=idle;
function popup(title,text,canResume){$('resultTitle').textContent=title;$('resultBody').textContent=text;$('resume').hidden=!canResume;if(!$('result').open)$('result').showModal();keys.clear();}
function pause(reason='确认后继续，暂停期间不会生成障碍。'){if(state!=='playing')return;state='paused';popup('已暂停',reason,true);}
function finish(collision){state='ended';popup(collision?'飞船被摧毁':'本局结束',`本局 ${score} 分 · 击毁 ${kills} 个障碍 · 生存 ${elapsed.toFixed(1)} 秒`,false);}
$('pause').onclick=()=>pause();$('resume').onclick=()=>{if(state==='paused'){state='playing';$('result').close();document.activeElement.blur();}};
$('result').addEventListener('cancel',e=>{e.preventDefault();if(state==='paused')finish(false);else idle();});
addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(k==='escape'&&state==='playing')finish(false);else if(k==='p')pause();else keys.add(k);});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>pause('窗口失去焦点，确认后继续。'));document.addEventListener('visibilitychange',()=>{if(document.hidden)pause('已暂停，返回后确认继续。')});
function makeRock(){
 const level=Math.min(5,Math.floor(elapsed/18));let x,y,side=Math.floor(Math.random()*4);if(side===0){x=Math.random()*w;y=-40}else if(side===1){x=w+40;y=Math.random()*(h-100)}else if(side===2){x=Math.random()*w;y=h+40}else{x=-40;y=Math.random()*(h-100)}
 if(Math.hypot(x-ship.x,y-ship.y)<210)return;
 const type=Math.floor(Math.random()*3),r=[12,21,30][type],hp=[1,3,5][type],a=Math.atan2(ship.y-y,ship.x-x)+(Math.random()-.5)*.9,v=(32+Math.random()*20+level*9)*[1.45,1,.7][type];
 rocks.push({x,y,r,hp,max:hp,vx:Math.cos(a)*v,vy:Math.sin(a)*v,angle:Math.random()*6,spin:(Math.random()-.5)*1.2,shape:Array.from({length:9},()=>.7+Math.random()*.3),value:[10,30,60][type],warn:.65,flash:0});
}
function shot(x,y,a){bullets.push({x,y,vx:Math.cos(a)*520,vy:Math.sin(a)*520,life:1.9});}
function explode(r){for(let i=0;i<18;i++){let a=Math.random()*Math.PI*2,v=30+Math.random()*110;sparks.push({x:r.x,y:r.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.3+Math.random()*.4});}}
function update(dt){elapsed+=dt;orbit+=dt*Math.PI/3;let dx=+keys.has('d')+ +keys.has('arrowright')-keys.has('a')-keys.has('arrowleft'),dy=+keys.has('s')+ +keys.has('arrowdown')-keys.has('w')-keys.has('arrowup'),length=Math.hypot(dx,dy)||1;
 ship.x=Math.max(25,Math.min(w-25,ship.x+dx/length*Number($('speed').value)*dt));ship.y=Math.max(120,Math.min(h-100,ship.y+dy/length*Number($('speed').value)*dt));
 fire-=dt;if(fire<=0){fire=.16;if(mode==='A'){shot(ship.x-4,ship.y-10,-Math.PI/2);shot(ship.x+4,ship.y-10,-Math.PI/2)}else if(mode==='B'){[-.3,0,.3].forEach(a=>shot(ship.x,ship.y-10,-Math.PI/2+a))}else{shot(ship.x-4,ship.y-10,-Math.PI/2);shot(ship.x+4,ship.y-10,-Math.PI/2);for(let i=0;i<4;i++){let a=orbit+i*Math.PI/2;shot(ship.x+Math.cos(a)*30,ship.y+Math.sin(a)*30,a)}}}
 spawn-=dt;if(spawn<=0){spawn=Math.max(.28,1-elapsed*.008);if(rocks.length<45)makeRock();}
 for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;}
 for(const r of rocks){r.warn-=dt;r.flash=Math.max(0,r.flash-dt);if(r.warn>0)continue;r.x+=r.vx*dt;r.y+=r.vy*dt;r.angle+=r.spin*dt;
 for(const b of bullets){if(b.life>0&&r.hp>0&&Math.hypot(r.x-b.x,r.y-b.y)<r.r+2){b.life=0;r.hp--;r.flash=.08;if(!r.hp){score+=r.value;kills++;explode(r)}}}
 if(r.hp>0&&Math.hypot(r.x-ship.x,r.y-ship.y)<r.r+4){explode(ship);finish(true);break;}}
 rocks=rocks.filter(r=>r.hp>0&&r.x>-130&&r.x<w+130&&r.y>-130&&r.y<h+130);bullets=bullets.filter(b=>b.life>0&&b.x>-20&&b.x<w+20&&b.y>-20&&b.y<h+20);
 for(const s of sparks){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;}sparks=sparks.filter(s=>s.life>0);
}
function draw(){g.clearRect(0,0,w,h);const glow=g.createRadialGradient(w*.5,h*.4,10,w*.5,h*.4,w*.7);glow.addColorStop(0,'#0c2330');glow.addColorStop(1,'#020910');g.fillStyle=glow;g.fillRect(0,0,w,h);for(const [x,y,r]of stars){g.fillStyle=`rgba(167,215,232,${.15+r*.45})`;g.fillRect(x*w,y*h,1+r,1+r);}
 for(const r of rocks){if(r.warn>0){g.strokeStyle='#f0c783';g.beginPath();g.arc(Math.max(14,Math.min(w-14,r.x)),Math.max(115,Math.min(h-90,r.y)),10,0,7);g.stroke();continue}g.save();g.translate(r.x,r.y);g.rotate(r.angle);g.beginPath();r.shape.forEach((v,i)=>{let a=i/9*Math.PI*2;g.lineTo(Math.cos(a)*r.r*v,Math.sin(a)*r.r*v)});g.closePath();g.fillStyle=r.flash?'#c5ffff':'#18313c';g.strokeStyle=['#88c4c8','#b5b79a','#b897a5'][[1,3,5].indexOf(r.max)];g.fill();g.stroke();g.restore();if($('hitbox').checked){g.strokeStyle='#ff8f7955';g.beginPath();g.arc(r.x,r.y,r.r,0,7);g.stroke();}}
 g.strokeStyle='#b3f3ef';g.lineWidth=2;for(const b of bullets){g.beginPath();g.moveTo(b.x,b.y);g.lineTo(b.x-b.vx*.014,b.y-b.vy*.014);g.stroke();}g.lineWidth=1;
 for(const s of sparks){g.fillStyle=`rgba(169,237,233,${Math.min(1,s.life*2)})`;g.fillRect(s.x,s.y,2,2);}
 if(state!=='ended'){for(let i=0;i<4;i++){let a=orbit+i*Math.PI/2,x=ship.x+Math.cos(a)*30,y=ship.y+Math.sin(a)*30;let halo=g.createRadialGradient(x,y,0,x,y,11);halo.addColorStop(0,'#a2d9df66');halo.addColorStop(1,'#a2d9df00');g.fillStyle=halo;g.beginPath();g.arc(x,y,11,0,7);g.fill();g.fillStyle='#a2d9df3a';g.beginPath();g.arc(x,y,5.3,0,7);g.fill();}g.save();g.translate(ship.x,ship.y);g.scale(.55,.55);g.fillStyle='#a7e9ed';g.beginPath();g.moveTo(0,-26);g.lineTo(19,19);g.lineTo(7,13);g.lineTo(0,19);g.lineTo(-7,13);g.lineTo(-19,19);g.closePath();g.fill();g.restore();g.fillStyle='#fff';g.beginPath();g.arc(ship.x,ship.y,2,0,7);g.fill();if($('hitbox').checked){g.strokeStyle='#ffbc75';g.beginPath();g.arc(ship.x,ship.y,4,0,7);g.stroke();}}
 $('score').textContent=String(score).padStart(5,'0');$('state').textContent={idle:'等待开始',playing:'战斗中',paused:'已暂停',ended:'已结束'}[state];$('metrics').textContent=`${elapsed.toFixed(1)} 秒 · 击毁 ${kills} · 场上 ${rocks.length} · 难度 ${1+Math.min(5,Math.floor(elapsed/18))}`;
}
function frame(now){let dt=Math.min(.033,(now-last)/1000);last=now;if(state==='playing')update(dt);draw();requestAnimationFrame(frame)}modeUI();requestAnimationFrame(frame);
</script></html>
