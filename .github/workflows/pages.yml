name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test production site
        run: npm test

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    env:
      DEPLOYED_URL: ${{ needs.deploy.outputs.page_url }}
      CANONICAL_URL: https://zijunlin.github.io/
    steps:
      - name: Verify deployed site
        run: |
          deployed_url="${DEPLOYED_URL%/}"
          canonical_url="${CANONICAL_URL%/}"

          if [ "$deployed_url" != "$canonical_url" ]; then
            echo "Deployment URL does not match the canonical site: $DEPLOYED_URL"
            exit 1
          fi

          content_type="$(
            curl --fail --silent --show-error \
              --location \
              --retry 6 \
              --retry-delay 5 \
              --retry-all-errors \
              --output /dev/null \
              --write-out '%{content_type}' \
              "$CANONICAL_URL"
          )"

          case "$content_type" in
            text/html*) ;;
            *)
              echo "Canonical site did not return HTML: $content_type"
              exit 1
              ;;
          esac
