<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08090b" />
    <meta name="description" content="Zijun Lin 的个人网站。" />
    <title>Zijun Lin</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <canvas id="shader-canvas" aria-hidden="true" hidden></canvas>

    <header class="site-header">
      <div class="brand" aria-label="Zijun Lin">ZIJUN LIN</div>
      <nav aria-label="主目录">
        <a href="#" class="is-current" aria-current="page">首页</a>
        <a href="#work">作品</a>
        <a href="#notes">心得</a>
        <a href="#about">关于</a>
        <span>本站</span>
      </nav>
    </header>

    <main id="content" class="content-slot" aria-label="页面内容" aria-busy="true">
      <div id="world-loading" role="status">
        <svg viewBox="0 0 400 160" aria-hidden="true">
          <ellipse cx="200" cy="95" rx="160" ry="55" />
          <ellipse cx="200" cy="80" rx="150" ry="50" />
          <path d="M145,80 v-35 h45 v35 M240,75 v-25 h25 v25" />
        </svg>
        <p>正在构建世界</p>
      </div>
      <div id="world-entry" hidden></div>
      <div id="world-error" role="alert" hidden>
        <h1>世界暂时无法显示</h1>
      </div>
    </main>
    <script type="module" src="/background.js"></script>
    <script type="module" src="/world.js"></script>
  </body>
</html>
