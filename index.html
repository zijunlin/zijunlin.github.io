<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08090b" />
    <meta name="description" content="Zijun Lin 的个人网站。" />
    <title>Zijun Lin</title>
    <link rel="stylesheet" href="/src/styles/home.css" />
  </head>
  <body>
    <canvas id="shader-canvas" aria-hidden="true" hidden></canvas>

    <header class="site-header">
      <div class="brand" aria-label="Zijun Lin">ZIJUN LIN</div>
      <nav aria-label="主目录">
        <a href="#" class="is-current" aria-current="page">首页</a>
        <a href="#work">作品</a>
        <a href="#notes">心得</a>
        <a href="#about">关于</a>
        <div class="language-switch" role="group" aria-label="切换语言" translate="no">
          <button type="button" data-language="zh-CN" lang="zh-CN" aria-pressed="false">中文</button>
          <button type="button" data-language="en" lang="en" aria-pressed="false">English</button>
        </div>
      </nav>
    </header>

    <main id="content" class="content-slot" aria-label="页面内容" aria-busy="true">
      <div id="world-loading" role="status">
        <svg viewBox="0 0 400 160" aria-hidden="true">
          <circle cx="90" cy="100" r="9" />
          <circle cx="160" cy="55" r="7" />
          <circle cx="240" cy="115" r="10" />
          <circle cx="310" cy="65" r="8" />
        </svg>
        <p>正在构建世界</p>
      </div>
      <div id="world-entry" hidden></div>
      <div id="world-error" role="alert" hidden>
        <h1>世界暂时无法显示</h1>
      </div>
    </main>
    <script type="module" src="/src/app/home.js"></script>
  </body>
</html>
