<body>
  <!-- THROWAWAY PROTOTYPE: three object languages, paired worlds, fixed layout A; ?variant=A|B|C. -->
  <header><a href="/">ZIJUN LIN <span>／ 世界对象研究</span></a><small>02 — FORM & MATERIAL STUDY</small></header>
  <main>
    <section class="intro"><div><p class="eyebrow">已选定 C · A/B 保留作比较</p><h1 id="title"></h1><p id="description"></p></div><div class="constants">共同条件<span>固定 3/4 正交视角 · A 环绕核心</span><span>雾白 / 石墨灰 / 琥珀 · 静态深蓝灰背景</span><span>相同四区坐标 · 相同主角占位</span></div></section>
    <section class="worlds" aria-label="两种世界形态比较">
      <article><div class="world-heading"><h2>建筑地形小岛</h2><span>01 / ISLAND</span></div><div id="island"></div><p id="island-note" class="world-note"></p></article>
      <article><div class="world-heading"><h2>抽象系统空间</h2><span>02 / SYSTEM</span></div><div id="system"></div><p id="system-note" class="world-note"></p></article>
    </section>
    <section class="details" aria-label="方案评估"><div><h3>几何与密度</h3><p id="geometry"></p></div><div><h3>材质方向</h3><p id="material"></p></div><div><h3>交互高亮</h3><p id="highlight"></p></div><div><h3>预期实现成本</h3><p id="cost"></p></div></section>
    <p class="interaction" id="interaction" aria-live="polite">悬停任一对象或标签，两种世界同步高亮；点击可固定比较。</p>
    <p class="scope">造型评审原型 · 使用矢量投影示意几何与材质，不代表最终 3D 渲染；成本为相对估计。背景、主角与正式页面另行设计。</p>
  </main>
