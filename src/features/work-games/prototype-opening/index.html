<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>开场实验 · 星际射击</title><link rel="stylesheet" href="./prototype.css"></head>
<body>
<iframe id="home" src="/" title="真实首页背景" tabindex="-1"></iframe>
<canvas id="effects"></canvas><div id="orbs"></div>
<header><span class="tag">OPENING STUDY / 可丢弃原型</span><h1>从星辰，到启航。</h1><p id="description"></p></header>
<aside><span id="phase">等待首页</span><strong id="clock">0.00 / 3.00s</strong><p id="detail"></p></aside>
<div id="hud" hidden>WASD / 方向键 移动　 ·　 自动射击　 ·　 ESC 结束 <b>00000</b></div>
<footer id="controls">
<div class="variants"><button id="prev" aria-label="上一个方案">←</button><strong id="variant"></strong><button id="next" aria-label="下一个方案">→</button></div>
<div class="playback"><button id="play" disabled>播放开场</button><button id="reset">回到首页</button><label>速度 <select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></label><label><input id="reduced" type="checkbox">简化动画</label></div>
<label class="timeline">演出进度 <input id="seek" type="range" min="0" max="3" step="0.01" value="0"></label>
</footer><script type="module" src="./opening-prototype.js"></script>
</body></html>
